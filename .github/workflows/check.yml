name: Shell and protocol checks
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl shellcheck
      - name: Check syntax, lint and reproducible bundle
        run: |
          for file in install.sh build.sh dodo-sbox.sh lib/*.sh tests/*.sh; do bash -n "$file"; done
          bash build.sh
          git diff --exit-code -- dist/
          shellcheck -S warning -s bash dist/dodo-sbox install.sh
      - name: Download checksum-pinned protocol core
        run: |
          source ./dodo-sbox.sh
          core_download "$RUNNER_TEMP/sing-box"
      - name: Validate configuration and real TLS proxy traffic
        env:
          TEST_CORE: ${{ runner.temp }}/sing-box
        run: |
          bash tests/local.sh
          bash tests/updates.sh
          bash tests/firewall.sh
          bash tests/certificates-menu.sh
          bash tests/management.sh
      - name: Verify real UFW in isolated network and mount namespaces
        run: |
          sudo apt-get install -y --no-install-recommends ufw
          sudo env GITHUB_ACTIONS=true unshare --net --mount bash tests/firewall-live.sh
      - name: Verify bootstrap rejects tampered downloads
        run: sudo bash tests/bootstrap.sh
      - name: Verify real systemd update timer and uninstall
        run: sudo bash tests/update-timer.sh
      - name: Verify published one-line entry downloads this release
        if: github.event_name == 'release'
        run: |
          curl --proto '=https' -fLsS https://raw.githubusercontent.com/dodo258/dodo-sbox/main/install.sh -o "$RUNNER_TEMP/install.sh"
          sudo bash "$RUNNER_TEMP/install.sh" version | tee "$RUNNER_TEMP/bootstrap-result"
          source lib/common.sh
          grep -F "dodo-sbox $DODO_VERSION / tested core $CORE_VERSION" "$RUNNER_TEMP/bootstrap-result"
