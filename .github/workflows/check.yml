name: Shell and protocol checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl shellcheck
      - name: Check syntax, lint and reproducible bundle
        run: |
          for file in build.sh dodo-sbox.sh lib/*.sh tests/*.sh; do bash -n "$file"; done
          bash build.sh
          git diff --exit-code -- dist/
          shellcheck -S warning -s bash dist/dodo-sbox
      - name: Download checksum-pinned protocol core
        run: |
          source ./dodo-sbox.sh
          core_download "$RUNNER_TEMP/sing-box"
      - name: Validate configuration and real TLS proxy traffic
        env:
          TEST_CORE: ${{ runner.temp }}/sing-box
        run: bash tests/local.sh
